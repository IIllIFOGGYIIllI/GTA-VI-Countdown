name: Launch Readiness Browser QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vice-city-browser-qa
  cancel-in-progress: false

jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local browser test dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run responsive, midnight and offline smoke checks
        run: npm run test:browser
      - name: Upload mobile audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore
