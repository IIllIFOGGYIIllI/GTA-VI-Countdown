name: Publish Vice City Countdown to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vice-city-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Verify core countdown and Launch Week features
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_launch.cjs
          node tests/test_launch_week.cjs
          node --check app.js
          node --check sw.js
          node --check assets/launch-week-core.js
          node --check assets/launch-week.js
          python3 -m json.tool data/news.json > /dev/null
          python3 -m json.tool data/screenshots.json > /dev/null
          python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Prepare minimal static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js sw.js manifest.webmanifest privacy.html terms.html spoilers.html dist/
          cp -R assets data dist/
          touch dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
