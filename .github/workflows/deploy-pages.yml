name: Publish Vice City Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vice-city-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Verify all Vice City Hub pages and archived launch features
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_launch.cjs
          node tests/test_launch_week.cjs
          node --check app.js
          node --check assets/cinematic-launch.js
          node --check assets/leonida-map.js
          node --check assets/hub-home.js
          node --check assets/player-hub.js
          node --check assets/after-launch.js
          node --check sw.js
          node --check assets/official-guide.js
          node --check assets/site-pages.js
          node --check assets/launch-week-core.js
          node --check assets/launch-week.js
          node --check assets/region-clock.js
          node --check assets/news.js
          node --check assets/media.js
          node --check assets/install.js
          node --check assets/vice-city-history.js
          node --check tests/browser-readiness.cjs
          node --check obs/obs.js
          python3 -m json.tool data/news.json > /dev/null
          python3 -m json.tool data/official-guide.json > /dev/null
          python3 -m json.tool data/screenshots.json > /dev/null
          python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Prepare minimal static site
        run: |
          mkdir -p dist
          cp index.html leonida-map.html player-hub.html countdown-archive.html launch-info.html launch-kit.html after-launch.html news.html leonida-files.html vice-city-history.html media.html app.html styles.css app.js sw.js manifest.webmanifest privacy.html terms.html spoilers.html dist/
          cp -R assets data obs dist/
          # Pillow converts the 300 DPI official printable map to a smaller on-demand WebP.
          # A package/network failure must not take the rest of the site offline.
          python3 -m pip install --quiet Pillow || echo "Pillow unavailable; basic map fallback remains"
          python3 scripts/stage_official_posters.py dist
          touch dist/.nojekyll
      - name: Download and verify original Vice City archive images
        run: |
          python3 scripts/mirror_history_images.py dist
          test -f dist/assets/history/image-sources.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Allow artifact metadata to become available
        run: sleep 10
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying Pages publication
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry Pages publication without re-uploading
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
