name: Check Official GTA VI News (review only)

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/news-check.yml'
      - 'scripts/check_news.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vc-news-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Verify spoiler-safe news filters offline
        run: python3 -m unittest discover -s tests -p 'test_news.py' -v
      - name: Check Rockstar Newswire without publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_news.py
